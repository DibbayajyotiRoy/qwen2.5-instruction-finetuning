model:
  base_model: "Qwen/Qwen2.5-7B-Instruct"
  revision: "main"
  max_seq_length: 2048
  dtype: "bfloat16"
  load_in_4bit: false
  use_gradient_checkpointing: true
  trust_remote_code: false

training:
  output_dir: "outputs/full-finetune"
  run_name: "qwen25-7b-full-run1"
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 1
  max_steps: -1
  learning_rate: 1.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  early_stopping_patience: 3
  seed: 42
  bf16: true
  fp16: false
  optim: "adamw_torch"
  group_by_length: true
  report_to: "tensorboard"
  remove_unused_columns: false
  dataset_text_field: "text"
  packing: false
  deepspeed: null

data:
  dataset_name: "yahma/alpaca-cleaned"
  dataset_config: null
  split: "train"
  eval_split: "validation"
  eval_size: 0.05
  max_samples: null
  instruction_field: "instruction"
  input_field: "input"
  output_field: "output"
  template: |
    Below is an instruction that describes a task. Write a response that appropriately completes the request.

    ### Instruction:
    {instruction}

    ### Input:
    {input}

    ### Response:
    {output}
  streaming: false
  cache_dir: "data/cache"

export:
  output_dir: "outputs/gguf"
  quantization_methods:
    - "q8_0"
  push_to_hub: false
  hub_model_id: null

inference:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  do_sample: true

benchmark:
  prompts_file: "data/benchmark_prompts.jsonl"
  num_runs: 3
  max_tokens: 256
  batch_size: 1
