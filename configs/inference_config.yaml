model:
  base_model: "outputs/qlora/final_merged"
  max_seq_length: 2048
  dtype: "bfloat16"

inference:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  do_sample: true

benchmark:
  prompts_file: "data/benchmark_prompts.jsonl"
  num_runs: 3
  max_tokens: 256
  batch_size: 1
